services:
  mysql:
    image: mysql:8.0.43
    environment:
      MYSQL_DATABASE: franchise_management
      MYSQL_USER: franchise_user
      MYSQL_PASSWORD: franchise_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/franchise_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: franchise_user
      DB_PASSWORD: franchise_password
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
