spring.application.name=franchise-management-api

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/franchise_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:franchise_user}
spring.datasource.password=${DB_PASSWORD:franchise_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
